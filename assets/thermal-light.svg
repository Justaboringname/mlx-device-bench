<title id="t">Qwen3-4B-4bit on the iPhone 18 Pro Max, tokens/s of each iteration during 100 s of continuous generation. Run 1 (in a case, no cooler) holds 44.5 for about 40 s, then drops to about 39 and ends at 39.5 while the thermal state rises from 1 to 2. Run 2 (no case, external cooler) stays at 44.7 with thermal state 0.</title>
